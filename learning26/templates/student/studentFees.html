<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Fees</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
        }
        .container {
            width: 80%;
            margin: 30px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .info p {
            margin: 6px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #28a745;
            color: white;
        }
        .paid {
            color: green;
            font-weight: bold;
        }
        .pending {
            color: red;
            font-weight: bold;
        }
        .summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #28a745;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Fees Details</h2>

    <div class="info">
        <p>Student Name: Khandekar Ved</p>
        <p>Course:Python</p>
        
    </div>

    <table>
        

       
            

       
    </table>

    <div class="summary">
        <p><strong>Total Fees:</strong> ₹6,000</p>
        <p><strong>Total Paid:</strong> ₹6,000</p>
        <p><strong>Total Pending:</strong> ₹6,000</p>
    </div>
</div>

</body>
</html>
