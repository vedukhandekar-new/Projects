<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
        }
        .login-box {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #2c7be5;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #1a5fc4;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Student Login</h2>

    <form method="post">
        <!-- CSRF token will be added later when using Django -->
        
        <label>Name</label>
        <input type="text" placeholder="Enter Name" required>

        <label>Password</label>
        <input type="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
