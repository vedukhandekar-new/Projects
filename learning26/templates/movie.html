            text-align: center;

            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            gap: 20px; 
        }

            background-color: #333;
            width: 200px;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);

        .movie-card:hover {
            transform: scale(1.05); 
        }

        .movie-card img {
            width: 100%;
            border-radius: 4px;
            height: 300px; 
            object-fit: cover;
            background-color: #444;
        }

        .movie-card h3 {
            font-size: 18px;
            margin: 10px 0;
        }

        
        .watch-btn {
            display: block;
            background-color: #e50914; 
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }

        .watch-btn:hover {
            background-color: #f40612;
        }
    </style>
